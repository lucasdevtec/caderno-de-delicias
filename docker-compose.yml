services:
  postgres:
    image: postgres:16-alpine
    container_name: caderno_delicias_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: caderno
      POSTGRES_PASSWORD: caderno_secret
      POSTGRES_DB: caderno_delicias
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caderno -d caderno_delicias"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
